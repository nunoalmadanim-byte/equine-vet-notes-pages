<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Equine Vet Notes</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f8fa; --card: #ffffff; --text: #1f2933; --muted: #57606a; --accent: #0958d9; --bad: #c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1b2026; --text: #e6e9ec; --muted: #a0aab4; --accent: #4c8dff; --bad: #ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border-radius: 14px; padding: 32px 24px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  a.button { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
             padding: 14px 24px; border-radius: 10px; }
  .bad h1 { color: var(--bad); }
</style>
</head>
<body>
<main id="box">
  <h1>Email confirmed</h1>
  <p>Your email address is confirmed. Open Equine Vet Notes on your phone and sign in.</p>
  <a class="button" href="equinevetnotes://">Open Equine Vet Notes</a>
</main>
<script>
  // Supabase puts any problem in the link's #fragment, e.g.
  // #error=access_denied&error_description=Email+link+is+invalid+or+has+expired
  var params = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
  var error = params.get('error_description') || params.get('error');
  if (error) {
    var box = document.getElementById('box');
    box.className = 'bad';
    box.querySelector('h1').textContent = 'This link didn’t work';
    box.querySelector('p').textContent = error.replace(/\+/g, ' ') +
      '. Open the app and sign up or sign in again to get a new email.';
  }
  // The link's tokens aren't needed here: drop them from the address bar.
  if (location.hash) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
